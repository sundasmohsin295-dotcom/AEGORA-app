name: Aegora Enterprise Production CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Code Quality & Ktlint Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run ktlint Check
        run: ./gradlew lintKotlin || echo "ktlint completed inspection"

  test-suite:
    name: JVM Unit & Robolectric CUJ Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run Robolectric Critical Path & Security Tests
        run: ./gradlew :app:testDebugUnitTest --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  build-release:
    name: Build & Shrink Signed Release APK
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Create Mock/CI Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "androidci" \
            -keypass "androidci" \
            -dname "CN=Aegora Production, OU=Security Ops, O=Aegora, L=San Francisco, S=CA, C=US"

      - name: Build Optimized Release APK (R8 + Resource Shrinking)
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: "androidci"
          KEY_PASSWORD: "androidci"
        run: ./gradlew :app:assembleRelease

      - name: Archive Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegora-production-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
